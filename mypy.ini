[mypy]
files = coupling/plane_strain.py, coupling/visualization.py, coupling/postprocessing.py, coupling/residual.py, test/test_plane_strain.py, test/test_visualization.py, test/test_postprocessing.py, test/test_residual.py, test/test_material_trial.py, coupling/transfer.py, test/test_transfer.py, test/test_face_traction.py, test/test_global_residual.py, coupling/newton.py, test/test_newton.py, coupling/jacobian.py, test/test_jacobian.py, coupling/loading.py, test/test_loading.py, coupling/plastic_plane_strain.py, test/test_plastic_plane_strain.py, test/test_plastic_visualization.py, test/test_analytical_jacobian.py
